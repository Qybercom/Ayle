<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — video preset</title>
	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-localization="ru"></script>
	<style>
		body { margin: 0; padding: 30px; background: #1b1b1b; }
	</style>
</head>
<body>

<script type="application/json" data-ayle="videoPreset">
{
	"Preset": "video",
	"MediaConfig": {
		"File": "example.mkv"
	}
}
</script>

</body>
</html>
