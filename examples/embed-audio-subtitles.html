<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — audio subtitles</title>

	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-localization="ru"></script>

	<style>
		body {
			margin: 0;
			padding: 30px;
			background: #1b1b1b;
		}
	</style>
</head>
<body>

<!--
	The media file/container should contain an audio track and one or more
	subtitle tracks. AyleHTTP exposes those subtitle tracks exactly as it
	does for video.
-->
<!--
	For audio-only playback subtitles are rendered by AyleUI's HTML overlay.
	NativeSubtitles is therefore explicitly disabled below.
-->
<script type="application/json" data-ayle="audioSubtitles">
{
	"PlayerConfig": {
		"Driver": {
			"Type": "mse"
		},
		"Player": {
			"UIMode": "minimal",
			"AutoFocus": true,
			"NativeSubtitles": false,
			"SubtitleOffset": -2.85,
			"AudioVisual": {
				"Type": "auto",
				"Subtitles": true,
				"MinHeight": 220
			},
			"MinimalUI": {
				"Play": true,
				"Timeline": true,
				"Time": true,
				"Volume": true,
				"Settings": true,
				"Subtitles": true,
				"Hints": false,
				"Info": {
					"Enabled": true,
					"Mode": "auto",
					"Position": "auto",
					"Artwork": true,
					"Title": true,
					"Artist": true,
					"Album": true,
					"Channel": true,
					"Subtitles": true
				},
				"SubtitlePopup": {
					"Enabled": true,
					"Persistent": false,
					"Position": "auto"
				}
			},
			"SettingsOrder": [
				"subtitles"
			]
		},
		"HTTP": {
			"MetadataURL": "../../server/metadata.php?file={file}",
			"TrackURL": "../../server/track.php?file={file}&type={kind}&track={track}&start={time}",
			"Stream": {
				"SkipInit": true
			}
		}
	},
	"MediaConfig": {
		"Mode": "audio",
		"File": "example.mp3"
	}
}
</script>

</body>
</html>
