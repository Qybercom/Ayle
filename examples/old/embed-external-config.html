<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — external JSON configs</title>
	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-auto-init="false"></script>
	<style>
		body {
			margin: 0;
			padding: 30px;
			background: #1b1b1b;
		}

		.ayle-slot + .ayle-slot {
			margin-top: 30px;
		}
	</style>
</head>
<body>

<div id="movie-player" class="ayle-slot"></div>
<div id="second-player" class="ayle-slot"></div>

<script>
(function () {
	function initExternalExamples () {
		/*
		 * A config may come from fetch(), WebSocket, an application store,
		 * server-rendered data, etc. InitAt() only needs the target and object.
		 */
		var movieConfig = {
			File: 'example.mkv',
			Player: {
				AutoFocus: true,
				Localization: 'ru',
				FontFamily: 'Calibri, sans-serif'
			},
			HTTP: {
				MetadataURL: '../../server/metadata.php?file={file}',
				TrackURL: '../../server/track.php?file={file}&type={kind}&track={track}&start={time}',
				Stream: {
					SkipInit: true
				}
			}
		};

		AyleEmbed.InitAt('#movie-player', movieConfig);

		/* Batch form for multiple externally supplied configs. */
		AyleEmbed.InitTargets([
			{
				Target: '#second-player',
				Config: {
					File: 'example.mkv',
					Player: {
						Localization: 'ru',
						FontFamily: 'Calibri, sans-serif'
					},
					HTTP: {
						MetadataURL: '../../server/metadata.php?file={file}',
						TrackURL: '../../server/track.php?file={file}&type={kind}&track={track}&start={time}',
						Stream: {
							SkipInit: true
						}
					}
				}
			}
		]);

		/*
		fetch('/api/ayle-config/123')
			.then(function (response) {
				return response.json();
			})
			.then(function (config) {
				AyleEmbed.InitAt('#movie-player', config);
			});
		*/
	}

	if (window.AyleEmbed)
		initExternalExamples();
	else
		document.addEventListener('playerBootstrapReady', initExternalExamples, { once: true });
})();
</script>

</body>
</html>
