<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — full declarative embed example</title>

	<!--
		Load resources once, but initialize the instance manually below.
		This lets the example restore localStorage settings and attach
		custom actions/renderers before media loading progresses.
	-->
	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-auto-init="false"></script>

	<style>
		body {
			margin: 0;
			padding: 30px;
			background: #1b1b1b;
		}
	</style>
</head>
<body>

<script>
(function () {
	function initFullExample () {
		var configElement = document.querySelector('script[type="application/json"][data-ayle="mainMovie"]');
		var config = AyleEmbed.ParseConfig(configElement);

		/*
		 * The original mse-time-streaming example persists these values.
		 * JSON itself is static, so restore them immediately before Init().
		 */
		config.Player.AutoPlay = localStorage.getItem('player.autoplay') === 'true';
		config.Player.Debug = localStorage.getItem('player.debug') === 'true';
		config.Player.DebugMP4 = localStorage.getItem('player.debugMP4') === 'true';

		config.Player.Shortcuts.PlayPause = localStorage.getItem('player.shortcuts.PlayPause') !== 'false';
		config.Player.Shortcuts.SeekArrows = localStorage.getItem('player.shortcuts.SeekArrows') !== 'false';
		config.Player.Shortcuts.SeekAngle = localStorage.getItem('player.shortcuts.SeekAngle') !== 'false';
		config.Player.Shortcuts.Volume = localStorage.getItem('player.shortcuts.Volume') !== 'false';
		config.Player.Shortcuts.Mute = localStorage.getItem('player.shortcuts.Mute') !== 'false';
		config.Player.Shortcuts.Fullscreen = localStorage.getItem('player.shortcuts.Fullscreen') !== 'false';
		config.Player.Shortcuts.PictureInPicture = localStorage.getItem('player.shortcuts.PictureInPicture') !== 'false';

		var instance = AyleEmbed.InitConfig(configElement, config);
		var player = instance.Player;
		var ui = instance.UI;

		player.On('hintOpen', function (hint) {
			console.log('Hint opened:', hint.ID);
		});

		player.On('hintClose', function (hint) {
			console.log('Hint closed:', hint.ID);
		});

		player.On('hintAction:example', function (data) {
			console.log('Custom hint action:', data);
		});

		player.On('hintAction:poll-a', function (data) {
			console.log('Poll answer: A', data);
		});

		player.On('hintAction:poll-b', function (data) {
			console.log('Poll answer: B', data);
		});

		player.On('quizAnswer', function (data) {
			console.log('Quiz answer:', data.Option, data);
		});

		player.On('hintAction:quiz-answer', function (data) {
			console.log('Quiz action executed:', data);
		});

		player.On('hintAction:rating-like', function (data) {
			console.log('Rating: like', data);
		});

		player.On('hintAction:rating-dislike', function (data) {
			console.log('Rating: dislike', data);
		});

		player.On('hintAction:add-to-list', function (data) {
			console.log('Add to list:', data);
		});

		player.On('hintAction:object-details', function (data) {
			console.log('Open object details:', data);
		});

		player.On('hintMedia', function (data) {
			console.log('Load related media:', data.Action.ID, data);
		});

		player.RegisterHintAction('share', function (action, hint, player, event) {
			console.log('Share moment:', action.URL, hint, event);
			return true;
		});

		player.RegisterHintRenderer('custom', function (hint, element, player, ui) {
			element.className = 'ayle-hint ayle-hint-type-rating';
			element.setAttribute('data-ayle-hint-type', 'custom');

			var body = document.createElement('div');
			body.className = 'ayle-hint-body';

			var title = document.createElement('div');
			title.className = 'ayle-hint-title';
			title.textContent = hint.Title;
			body.appendChild(title);

			var text = document.createElement('div');
			text.className = 'ayle-hint-text';
			text.textContent = hint.Text;
			body.appendChild(text);

			var actions = document.createElement('div');
			actions.className = 'ayle-hint-actions';

			var like = document.createElement('button');
			like.type = 'button';
			like.className = 'ayle-hint-action';
			like.textContent = 'Нравится';
			like.onclick = function (event) {
				event.stopPropagation();
				console.log('Rated: like', hint);
				ui.DismissHint(hint);
			};

			var dislike = document.createElement('button');
			dislike.type = 'button';
			dislike.className = 'ayle-hint-action';
			dislike.textContent = 'Не нравится';
			dislike.onclick = function (event) {
				event.stopPropagation();
				console.log('Rated: dislike', hint);
				ui.DismissHint(hint);
			};

			actions.appendChild(like);
			actions.appendChild(dislike);
			body.appendChild(actions);
			element.appendChild(body);
		});

		player.On('settingsAction:channel-profile', function (data) {
			console.log('Open external channel profile:', data.Item);
		});

		player.On('settingsAction:debug-info', function (data) {
			console.log('Integration data:', player.Options.Integration.Data);
		});

		player.On('settingsAction:ping', function (data) {
			console.log('External Settings action:', data.Item);
		});

		player.On('autoplayBlocked', function (error) {
			console.error('Autoplay blocked:', error);
		});

		player.On('autoplaySettingsChange', function (data) {
			localStorage.setItem('player.autoplay', data.Value ? 'true' : 'false');
			console.log('Autoplay setting saved:', data.Value);
		});

		player.On('debugSettingsChange', function (data) {
			localStorage.setItem('player.debug', data.Value ? 'true' : 'false');
			console.log('Debug setting saved:', data.Value);
		});

		player.On('debugMP4SettingsChange', function (data) {
			localStorage.setItem('player.debugMP4', data.Value ? 'true' : 'false');
			console.log('MP4 debug setting saved:', data.Value);
		});

		player.On('shortcutSettingsChange', function (data) {
			localStorage.setItem(
				'player.shortcuts.' + data.Name,
				data.Value ? 'true' : 'false'
			);
			console.log('Shortcut setting saved:', data.Name, data.Value);
		});

		player.On('error', function (error) {
			console.error('Media player error:', error);
		});

		document.addEventListener('playerReady', function (event) {
			if (event.detail.ID !== 'mainMovie')
				return;

			console.log('Supported codecs:', event.detail.HTTP ? event.detail.HTTP.SupportedCodecs : []);
			console.log('Metadata:', event.detail.Metadata);
			console.log('PlayerSource:', event.detail.Source);
		});
	}

	if (window.AyleEmbed)
		initFullExample();
	else
		document.addEventListener('playerBootstrapReady', initFullExample, { once: true });
})();
</script>

</body>
</html>
