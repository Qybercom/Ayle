<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — minimal audio with Channel, Settings and subtitles</title>

	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-localization="ru"></script>

	<style>
		body {
			margin: 0;
			padding: 30px;
			background: #1b1b1b;
		}
	</style>
</head>
<body>

<script type="application/json" data-ayle="audioPlayer">
{
	"MediaConfig": {
		"Mode": "audio",
		"File": "example.mp3",
		"Channel": {
			"Name": "Nature Explorer",
			"Avatar": "../../img/channel-avatar.png",
			"Profile": {
				"Name": "@natureexplorer",
				"URL": "#",
				"Target": "_blank"
			}
		},
		"Settings": [
			{
				"ID": "channel-profile",
				"Title": "Профиль канала",
				"Value": "@natureexplorer",
				"Event": "channel-profile"
			},
			{
				"ID": "integration",
				"Title": "Интеграция",
				"Items": [
					{
						"ID": "debug-info",
						"Title": "Показать данные интеграции",
						"Event": "debug-info"
					},
					{
						"ID": "advanced",
						"Title": "Дополнительно",
						"Items": [
							{
								"ID": "ping",
								"Title": "Тест внешнего действия",
								"Event": "ping"
							},
							{
								"ID": "disabled-example",
								"Title": "Недоступное действие",
								"Value": "Отключено",
								"Disabled": true
							}
						]
					}
				]
			}
		],
		"Data": {
			"Example": true
		}
	},
	"PlayerConfig": {
		"Driver": {
			"Type": "mse"
		},
		"Player": {
			"UIMode": "minimal",
			"AutoFocus": true,
			"FontFamily": "Calibri, sans-serif",
			"SubtitleOffset": -2.85,
			"AudioVisual": {
				"Type": "auto",
				"Subtitles": true
			},
			"MinimalUI": {
				"Play": true,
				"Timeline": true,
				"Time": true,
				"Volume": true,
				"Settings": true,
				"Subtitles": true,
				"Chapters": false,
				"Header": false,
				"Hints": false,
				"Info": {
					"Enabled": true,
					"Mode": "auto",
					"Position": "auto",
					"Artwork": true,
					"Title": true,
					"Artist": true,
					"Album": true,
					"Channel": true,
					"Subtitles": true
				},
				"SubtitlePopup": {
					"Enabled": true,
					"Persistent": false,
					"Position": "auto"
				}
			},
			"SettingsOrder": [
				"autoplay",
				"audio",
				"subtitles",
				"",
				"shortcuts",
				"debug",
				"",
				"integration"
			],
			"NativeSubtitles": false
		},
		"HTTP": {
			"MetadataURL": "../../server/metadata.php?file={file}",
			"TrackURL": "../../server/track.php?file={file}&type={kind}&track={track}&start={time}",
			"Stream": {
				"SkipInit": true
			}
		}
	}
}
</script>

</body>
</html>
