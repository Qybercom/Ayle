<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — audio with visual area and hints</title>

	<script data-ayle-driver="mse" src="../ayle-bootstrap.js" data-ayle-loader data-ayle-localization="ru"></script>

	<style>
		body {
			margin: 0;
			padding: 30px;
			background: #1b1b1b;
		}
	</style>
</head>
<body>

<script type="application/json" data-ayle="audioHints">
{
	"PlayerConfig": {
		"Driver": {
			"Type": "mse"
		},
		"Player": {
			"UIMode": "normal",
			"AutoFocus": true,
			"FontFamily": "Calibri, sans-serif",

			"AudioVisual": {
				"Type": "auto"
			}
		},
		"HTTP": {
			"MetadataURL": "../../server/metadata.php?file={file}",
			"TrackURL": "../../server/track.php?file={file}&type={kind}&track={track}&start={time}",
			"Stream": {
				"SkipInit": true
			}
		}
	},

	"MediaConfig": {
		"Mode": "audio",
		"File": "example.mp3",

		"Channel": {
			"Name": "Nature Explorer",
			"Avatar": "../../img/channel-avatar.png",
			"Profile": {
				"Name": "@natureexplorer",
				"URL": "#",
				"Target": "_blank"
			}
		},

		"Hints": [
			{
				"ID": "audio-info",
				"Type": "info",
				"Position": "top-right",
				"Start": 5,
				"Duration": 8,
				"Title": "Audio Hint",
				"Text": "Audio-only режим может сохранять визуальную область для обложки и Hints."
			}
		]
	}
}
</script>

</body>
</html>
