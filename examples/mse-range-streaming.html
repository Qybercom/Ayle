<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ayle Media Player — HTTP Range MSE streaming</title>
	<link rel="stylesheet" href="../ayle.css">
</head>
<body>
<div class="ayle" id="ayle" tabindex="0">
	<video class="ayle-video" preload="metadata"></video>
	<div class="ayle-surface"></div>
	<button class="ayle-icon-button ayle-center-play" type="button" data-ayle-i18n-label="play" aria-label="Play" title="Play">
		<svg class="ayle-icon ayle-icon-play" aria-hidden="true"><use href="../ayle-icons.svg#icon-play"></use></svg>
		<svg class="ayle-icon ayle-icon-pause" aria-hidden="true"><use href="../ayle-icons.svg#icon-pause"></use></svg>
	</button>
	<div class="ayle-header">
		<div class="ayle-channel">
			<img class="ayle-channel-avatar" alt="">
			<div class="ayle-channel-info">
				<div class="ayle-channel-name"></div>
				<a class="ayle-channel-profile" href="#"></a>
			</div>
		</div>
		<div class="ayle-title">
			<div class="ayle-title-media"></div>
			<div class="ayle-title-chapter"></div>
		</div>
	</div>
	<div class="ayle-hints" aria-live="polite"></div>
	<div class="ayle-subtitle-overlay" aria-live="off"></div>
	<div class="ayle-loading" aria-label="Loading">
		<img class="ayle-loading-icon" src="../icons/loading.svg" alt="">
	</div>
		<div class="ayle-controls">
		<button class="ayle-icon-button ayle-play" type="button" data-ayle-i18n-label="play" aria-label="Play" title="Play">
			<svg class="ayle-icon ayle-icon-play" aria-hidden="true"><use href="../ayle-icons.svg#icon-play"></use></svg>
			<svg class="ayle-icon ayle-icon-pause" aria-hidden="true"><use href="../ayle-icons.svg#icon-pause"></use></svg>
		</button>

		<div class="ayle-timeline">
			<div class="ayle-buffered"></div>
			<div class="ayle-progress"></div>
			<div class="ayle-handle"></div>
			<div class="ayle-preview"><div class="ayle-preview-time">0:00</div></div>
		</div>

		<div class="ayle-time"><span class="ayle-current">0:00</span><span>/</span><span class="ayle-duration">0:00</span></div>

		<div class="ayle-volume-control">
			<button class="ayle-icon-button ayle-mute" type="button" data-ayle-i18n-label="mute" aria-label="Mute" title="Mute">
				<svg class="ayle-icon" aria-hidden="true"><use href="../ayle-icons.svg#icon-volume"></use></svg>
			</button>
			<input class="ayle-volume" type="range" min="0" max="100" value="100" aria-label="Volume">
		</div>

		<div class="ayle-popover-container ayle-chapters-control">
			<button class="ayle-icon-button ayle-chapters-button" type="button" data-ayle-i18n-label="chapters" aria-label="Chapters" title="Chapters" aria-expanded="false">
				<svg class="ayle-icon" aria-hidden="true"><use href="../ayle-icons.svg#icon-chapters"></use></svg>
			</button>
			<div class="ayle-popover ayle-chapters-popover" role="menu" aria-label="Chapters">
				<div class="ayle-chapters-list"></div>
			</div>
		</div>

		<div class="ayle-popover-container ayle-quality-control">
			<button class="ayle-quality-button" type="button" data-ayle-i18n-label="videoQuality" aria-label="Video quality" title="Video quality" aria-expanded="false">
				<span class="ayle-quality-button-name" data-ayle-i18n="quality">Quality</span>
				<span class="ayle-quality-badge" aria-hidden="true"></span>
			</button>
			<div class="ayle-popover ayle-quality-popover" role="menu" aria-label="Video quality">
				<div class="ayle-quality-list" role="radiogroup" aria-label="Video quality"></div>
				<select class="ayle-quality ayle-quality-native" data-ayle-i18n-title="quality" title="Quality" aria-hidden="true" tabindex="-1"></select>
			</div>
		</div>

		<div class="ayle-popover-container ayle-settings-control">
			<button class="ayle-icon-button ayle-settings-button" type="button" data-ayle-i18n-label="settings" aria-label="Settings" title="Settings" aria-expanded="false">
				<svg class="ayle-icon" aria-hidden="true"><use href="../ayle-icons.svg#icon-settings"></use></svg>
			</button>
			<div class="ayle-popover ayle-settings-popover">
				<div class="ayle-settings-page ayle-settings-page-main is-active" data-settings-page="main">
					<label class="ayle-settings-toggle ayle-playback-settings" data-ayle-settings-item="autoplay">
						<span data-ayle-i18n="autoplay">Autoplay</span>
						<input class="ayle-autoplay-toggle" type="checkbox">
						<span class="ayle-toggle-switch" aria-hidden="true"></span>
					</label>

					<button class="ayle-settings-submenu-item ayle-audio-submenu-button" data-ayle-settings-item="audio" type="button">
						<span class="ayle-settings-submenu-label" data-ayle-i18n="audio">Audio</span>
						<span class="ayle-settings-submenu-value ayle-audio-submenu-value"></span>
						<span class="ayle-settings-submenu-arrow" aria-hidden="true">›</span>
					</button>

					<button class="ayle-settings-submenu-item ayle-subtitles-submenu-button" data-ayle-settings-item="subtitles" type="button">
						<span class="ayle-settings-submenu-label" data-ayle-i18n="subtitles">Subtitles</span>
						<span class="ayle-settings-submenu-value ayle-subtitles-submenu-value"></span>
						<span class="ayle-settings-submenu-arrow" aria-hidden="true">›</span>
					</button>

					<button class="ayle-settings-submenu-item ayle-debug-submenu-button" data-ayle-settings-item="debug" type="button">
						<span class="ayle-settings-submenu-label" data-ayle-i18n="debug">Debug</span>
						<span class="ayle-settings-submenu-value"></span>
						<span class="ayle-settings-submenu-arrow" aria-hidden="true">›</span>
					</button>

					<button class="ayle-settings-submenu-item ayle-shortcuts-submenu-button" data-ayle-settings-item="shortcuts" type="button">
						<span class="ayle-settings-submenu-label" data-ayle-i18n="shortcuts">Shortcuts</span>
						<span class="ayle-settings-submenu-value"></span>
						<span class="ayle-settings-submenu-arrow" aria-hidden="true">›</span>
					</button>

					<div class="ayle-integration-settings" data-ayle-settings-item="integration" style="display:none">
						<div class="ayle-integration-settings-list"></div>
					</div>

					<label class="ayle-settings-toggle" data-ayle-settings-item="nativeSubtitles">
						<span data-ayle-i18n="nativeSubtitles">Native subtitles</span>
						<input class="ayle-native-subtitles-toggle" type="checkbox">
						<span class="ayle-toggle-switch" aria-hidden="true"></span>
					</label>

					<label class="ayle-settings-toggle" data-ayle-settings-item="nativeSubtitlesInPiP">
						<span data-ayle-i18n="nativeSubtitlesInPiP">Native subtitles in PiP</span>
						<input class="ayle-pip-native-subtitles-toggle" type="checkbox">
						<span class="ayle-toggle-switch" aria-hidden="true"></span>
					</label>
				</div>

				<div class="ayle-settings-page" data-settings-page="audio">
					<div class="ayle-settings-submenu-header">
						<button class="ayle-settings-back" type="button" data-ayle-i18n-label="back" aria-label="Back" title="Back">‹</button>
						<div class="ayle-settings-submenu-title" data-ayle-i18n="audio">Audio</div>
					</div>
					<div class="ayle-settings-section ayle-audio-field">
						<select class="ayle-audio ayle-settings-native-select" data-ayle-i18n-title="audioTrack" title="Audio track"></select>
						<div class="ayle-settings-list ayle-audio-list"></div>
					</div>
				</div>

				<div class="ayle-settings-page" data-settings-page="subtitles">
					<div class="ayle-settings-submenu-header">
						<button class="ayle-settings-back" type="button" data-ayle-i18n-label="back" aria-label="Back" title="Back">‹</button>
						<div class="ayle-settings-submenu-title" data-ayle-i18n="subtitles">Subtitles</div>
					</div>
					<div class="ayle-settings-section ayle-subtitles-field">
						<select class="ayle-subtitles ayle-settings-native-select" data-ayle-i18n-title="subtitles" title="Subtitles"></select>
						<div class="ayle-settings-list ayle-subtitle-list"></div>
					</div>
				</div>

				<div class="ayle-settings-page" data-settings-page="debug">
					<div class="ayle-settings-submenu-header">
						<button class="ayle-settings-back" type="button" data-ayle-i18n-label="back" aria-label="Back" title="Back">‹</button>
						<div class="ayle-settings-submenu-title" data-ayle-i18n="debug">Debug</div>
					</div>
					<div class="ayle-settings-section ayle-debug-settings">
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="debugEnabled">Ayle debug</span>
							<input class="ayle-debug-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="debugMP4">MP4 debug</span>
							<input class="ayle-debug-mp4-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
					</div>
				</div>

				<div class="ayle-settings-page" data-settings-page="shortcuts">
					<div class="ayle-settings-submenu-header">
						<button class="ayle-settings-back" type="button" data-ayle-i18n-label="back" aria-label="Back" title="Back">‹</button>
						<div class="ayle-settings-submenu-title" data-ayle-i18n="shortcuts">Shortcuts</div>
					</div>
					<div class="ayle-settings-section ayle-shortcuts-settings">
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutPlayPause">Play / Pause</span>
							<input class="ayle-shortcut-play-pause-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutSeekArrows">Seek with arrows</span>
							<input class="ayle-shortcut-seek-arrows-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutSeekAngle">Seek with , / .</span>
							<input class="ayle-shortcut-seek-angle-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutVolume">Volume with arrows</span>
							<input class="ayle-shortcut-volume-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutMute">Mute</span>
							<input class="ayle-shortcut-mute-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutFullscreen">Fullscreen</span>
							<input class="ayle-shortcut-fullscreen-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
						<label class="ayle-settings-toggle">
							<span data-ayle-i18n="shortcutPictureInPicture">Picture in Picture</span>
							<input class="ayle-shortcut-pip-toggle" type="checkbox">
							<span class="ayle-toggle-switch" aria-hidden="true"></span>
						</label>
					</div>
				</div>
			</div>
		</div>

		<button class="ayle-icon-button ayle-pip" type="button" data-ayle-i18n-label="pictureInPicture" aria-label="Picture in Picture" title="Picture in Picture" aria-pressed="false">
			<svg class="ayle-icon" aria-hidden="true"><use href="../ayle-icons.svg#icon-pip"></use></svg>
		</button>
		<button class="ayle-icon-button ayle-fullscreen" type="button" data-ayle-i18n-label="enterFullscreen" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false">
			<svg class="ayle-icon ayle-icon-fullscreen-enter" aria-hidden="true"><use href="../ayle-icons.svg#icon-fullscreen-enter"></use></svg>
			<svg class="ayle-icon ayle-icon-fullscreen-exit" aria-hidden="true"><use href="../ayle-icons.svg#icon-fullscreen-exit"></use></svg>
		</button>
	</div>
</div>
<script src="../ayle.js"></script>
<script>
var root = document.getElementById('ayle');
var video = root.querySelector('.ayle-video');
var player = new Ayle(new AyleMSEMediaDriver(video), {
	NativeSubtitles: false,
	AutoNativeSubtitlesInPictureInPicture: true,
	ForceShowQualityList: true,

	/* Only controls the large center button. Clicking the video always toggles play/pause. */
	ShowCenterPlayButton: true,
	AutoSelectFirstSubtitleTrack: false,

	Integration: {
		Channel: null,
		Hints: [],
		Data: null
	}
});
var ui = new AyleUI(root, player);

/*
 * Range mode reads the fMP4 track sequentially in 2 MiB HTTP byte ranges.
 * It is ideal for bounded-RAM forward playback. Arbitrary seek to data that
 * has never been buffered, and audio switching at a non-zero position,
 * require segment mode because a generic byte offset has no time mapping.
 */
var source = new AyleSource({
	ID: 'movie-range',
	Variants: [
		new AyleMediaVariant({
			ID: 'video',
			URL: '/media.php?track=video',
			Type: 'video/mp4',
			Codecs: 'avc1.640028',
			Default: true,
			Stream: {
				Mode: 'range',
				ChunkSize: 2 * 1024 * 1024,
				BufferAhead: 30,
				BufferBehind: 20
			}
		})
	],
	AudioTracks: [
		new AyleMediaTrack({
			ID: 'ru',
			URL: '/media.php?track=audio-ru',
			Type: 'audio/mp4',
			Codecs: 'mp4a.40.2',
			Label: 'Русский',
			Default: true,
			Stream: {
				Mode: 'range',
				ChunkSize: 512 * 1024,
				BufferAhead: 30,
				BufferBehind: 20
			}
		})
	]
});

player.Load(source);
player.On('error', function (error) { console.error(error); });
</script>
</body>
</html>
