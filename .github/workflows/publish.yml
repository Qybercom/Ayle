name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use current npm with Trusted Publishing support
        run: npm install --global npm@^11.15.0

      - name: Set release version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-release-version.mjs "$VERSION"

      - run: npm ci
      - run: npm install --prefix bindings/angular
      - run: npm run build
      - run: npm run check

      - name: Release preflight
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-preflight.mjs "$VERSION"

      - run: npm pack --dry-run
      - run: npm pack --dry-run ./bindings/react
      - run: npm pack --dry-run ./bindings/angular/dist

      - name: Publish Ayle core
        run: npm publish --access public

      - name: Publish React binding
        run: npm publish ./bindings/react --access public

      - name: Publish Angular binding
        run: npm publish ./bindings/angular/dist