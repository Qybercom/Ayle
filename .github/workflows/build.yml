name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm install
      - run: npm install --prefix bindings/angular
      - run: npm install --prefix examples/angular
      - run: npm run build
      - run: npm run check
      - run: npm run check:angular-example
      - run: npm pack --dry-run
      - run: npm pack --dry-run ./bindings/react/dist
      - run: npm pack --dry-run ./bindings/angular/dist